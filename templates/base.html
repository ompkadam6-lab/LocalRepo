<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mira-Bhayandar Heritage{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar">
    <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">MB</span>
        <span>Mira-Bhayandar<br><small>Heritage & Culture</small></span>
    </a>
    <div class="nav-links">
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('artisan_list') }}">Artisans</a>
        <a href="{{ url_for('articles_page') }}">Stories</a>
        <a href="{{ url_for('videos_page') }}">Videos</a>
        <a href="{{ url_for('experiences_page') }}">Experiences</a>
        <a class="nav-cta" href="{{ url_for('routes_page') }}">Plan a Route</a>
    </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<footer>
    <div>
        <strong>Mira-Bhayandar Heritage</strong>
        <p>Discover places, people, crafts and stories that make the region unique.</p>
    </div>
    <div class="footer-links">
        <a href="{{ url_for('home') }}">Explore</a>
        <a href="{{ url_for('artisan_list') }}">Artisans</a>
        <a href="{{ url_for('articles_page') }}">Stories</a>
        <a href="{{ url_for('routes_page') }}">Routes</a>
    </div>
</footer>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
